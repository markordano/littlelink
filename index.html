<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xen</title>
  <meta name="theme-color" content="#000000">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      cursor: pointer;
      transition: opacity 0.55s ease;
    }
    #overlay h2 {
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 1.2px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      color: #fff;
    }
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease;
    }
    .page.show {
      opacity: 1;
      pointer-events: auto;
    }
    /* ========== VOLUME ========== */
    .volume-control {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 30;
      display: flex;
      align-items: center;
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      height: 42px;
      padding: 0 11px;
      transition: all 0.3s ease;
      overflow: hidden;
      width: 42px;
    }
    .volume-control:hover {
      width: 165px;
      padding-right: 14px;
    }
    .volume-btn {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .volume-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
      display: block;
    }
    .volume-slider {
      width: 0;
      opacity: 0;
      transition: all 0.3s ease;
      margin-left: 12px;
      display: flex;
      align-items: center;
    }
    .volume-control:hover .volume-slider {
      width: 105px;
      opacity: 1;
    }
    .volume-slider input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
    .volume-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }
    .volume-slider input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    /* Views */
    .views {
      position: fixed;
      bottom: 18px;
      left: 18px;
      font-size: 0.85rem;
      opacity: 0.75;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 30;
      text-shadow: 0 0 8px black;
    }
    /* Center */
    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 420px;
      padding: 0 20px;
    }
    .username {
      font-size: 2.4rem;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }
    .motto {
      font-size: 1.05rem;
      opacity: 0.9;
      margin-bottom: 22px;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 8px black;
    }
    /* Profile pill */
    .profile-pill {
      background: rgba(15, 15, 15, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 16px 10px 10px;
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      min-width: 240px;
    }
    .avatar-wrap {
      position: relative;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      display: block;
    }
    /* Red prohibition icon over avatar */
    .avatar-badge {
      position: absolute;
      bottom: -2px;
      left: -2px;
      width: 18px;
      height: 18px;
      background: #e53935;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #111;
    }
    .avatar-badge svg {
      width: 10px;
      height: 10px;
    }
    .pill-info {
      text-align: left;
      line-height: 1.3;
    }
    .pill-name {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pill-name .badge {
      font-size: 0.78rem;
      opacity: 0.75;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .leaf-icon {
      width: 13px;
      height: 13px;
      vertical-align: -1px;
    }
    .pill-status {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 1px;
    }
    /* Socials */
    .socials {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .socials a {
      width: 42px;
      height: 42px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .socials a:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
    }
    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <video id="bg-video" loop muted playsinline>
    <source src="au.mp4" type="video/mp4">
  </video>

  <div id="overlay">
    <h2>click to enter...</h2>
  </div>

  <div class="page" id="main-page">
    <!-- Volume -->
    <div class="volume-control">

      </div>
      <div class="volume-slider">
        <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="0.18">
      </div>
    </div>

    <!-- Views -->
    <div class="views">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
      </svg>
      1,036
    </div>

    <div class="center">
      <div class="username">xen</div>
      <div class="motto">my honor</div>

      <div class="profile-pill">
        <div class="avatar-wrap">
          <img src="avatar.png" alt="avatar" class="avatar">
          <div class="avatar-badge">
            <!-- red prohibition icon -->
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" fill="#e53935"/>
              <rect x="6" y="10.5" width="12" height="3" rx="1.5" fill="white"/>
            </svg>
          </div>
        </div>
        <div class="pill-info">
          <div class="pill-name">
            8kbf
            <span class="badge">
              <img src="leaf.png" alt="" class="leaf-icon"> 505
            </span>
          </div>
          <div class="pill-status">currently doing nothing</div>
        </div>
      </div>

      <div class="socials">
        <a href="https://instagram.com/youruser" target="_blank" title="Instagram">

        </a>

        </a>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('bg-video');
    const overlay = document.getElementById('overlay');
    const page = document.getElementById('main-page');
    const volumeBtn = document.getElementById('volumeBtn');
    const volumeRange = document.getElementById('volumeRange');
    const iconUnmuted = document.getElementById('icon-unmuted');
    const iconMuted = document.getElementById('icon-muted');

    video.volume = 0.18;
    volumeRange.value = 0.18;
    video.pause();

    overlay.addEventListener('click', () => {
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
        page.classList.add('show');
        video.muted = false;
        video.play().catch(() => {});
      }, 550);
    });

    volumeRange.addEventListener('input', () => {
      video.volume = volumeRange.value;
      video.muted = false;
      iconUnmuted.style.display = 'block';
      iconMuted.style.display = 'none';
    });

    volumeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (video.muted || video.volume === 0) {
        video.muted = false;
        video.volume = volumeRange.value || 0.18;
        iconUnmuted.style.display = 'block';
        iconMuted.style.display = 'none';
      } else {
        video.muted = true;
        iconUnmuted.style.display = 'none';
        iconMuted.style.display = 'block';
      }
    });
  </script>
</body>
</html>
