<!DOCTYPE html>
<html class="theme-dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xen</title>
  <meta name="theme-color" content="#000000">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: white;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px black;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      text-shadow: 0 0 8px black;
    }

    .button {
      display: inline-block;
      padding: 12px 28px;
      background: #ff0000;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    .volume-control {
      margin-top: 20px;
      background: rgba(0,0,0,0.6);
      padding: 10px 18px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .volume-control input {
      width: 120px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="au.mp4" type="video/mp4">
  </video>

  <div class="content">
    <h1>xen</h1>
    <p>Meine Ehre Heisst Treue</p>
    
    <a class="button" href="https://youtube.com/@xenflarek" target="_blank">
      YouTube
    </a>

    <div class="volume-control">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.25">
    </div>
  </div>

  <script>
    const video = document.getElementById('bg-video');
    const volumeSlider = document.getElementById('volume');

    // Set starting volume low
    video.volume = 0.25;

    // Unmute on first click anywhere
    document.body.addEventListener('click', () => {
      video.muted = false;
    }, { once: true });

    // Volume slider control
    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
      video.muted = false;
    });
  </script>
</body>
</html>
