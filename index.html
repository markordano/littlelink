<!DOCTYPE html>
<html class="theme-dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xen</title>
  <meta name="theme-color" content="#000000">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: white;
      font-family: sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* Click to enter overlay */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    #overlay h2 {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-shadow: 0 0 10px black;
    }

    /* Main content (hidden at start) */
    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .content.show {
      opacity: 1;
      pointer-events: auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px black;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      text-shadow: 0 0 8px black;
    }

    .button {
      display: inline-block;
      padding: 12px 28px;
      background: #ff0000;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="au.mp4" type="video/mp4">
  </video>

  <!-- Click to enter screen -->
  <div id="overlay">
    <h2>click to enter...</h2>
  </div>

  <!-- Main content -->
  <div class="content" id="main-content">
    <h1>xen</h1>
    <p>Meine Ehre Heisst Treue</p>
    
    <a class="button" href="https://youtube.com/@xenflarek" target="_blank">
      YouTube
    </a>
  </div>

  <script>
    const video = document.getElementById('bg-video');
    const overlay = document.getElementById('overlay');
    const content = document.getElementById('main-content');

    video.volume = 0.25;

    overlay.addEventListener('click', () => {
      // Fade out the overlay
      overlay.style.opacity = '0';
      
      setTimeout(() => {
        overlay.style.display = 'none';
        content.classList.add('show');
        
        // Start audio
        video.muted = false;
      }, 600);
    });
  </script>
</body>
</html>
