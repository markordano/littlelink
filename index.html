<!DOCTYPE html>
<html class="theme-dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xen</title>
  <meta name="theme-color" content="#000000">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Background video – starts paused */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* Click-to-enter overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    #overlay h2 {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 3px;
      text-shadow: 0 0 12px black;
    }

    /* Main content – hidden until click */
    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      padding: 20px;
    }

    .content.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Profile card (closer to the guns.lol / image style) */
    .profile {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px 36px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 14px;
    }

    .username {
      font-size: 1.7rem;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .status {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 6px;
    }

    .location {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* Social icons row */
    .socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .socials a {
      color: white;
      opacity: 0.9;
      transition: opacity 0.2s, transform 0.2s;
      font-size: 1.5rem;
      text-decoration: none;
    }

    .socials a:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Optional view count style */
    .views {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 0.85rem;
      opacity: 0.6;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- Background video – NO autoplay -->
  <video id="bg-video" loop muted playsinline>
    <source src="au.mp4" type="video/mp4">
  </video>

  <!-- Click to enter -->
  <div id="overlay">
    <h2>click to enter...</h2>
  </div>

  <!-- Main profile content -->
  <div class="content" id="main-content">
    <div class="profile">
      <!-- Replace the avatar src with your own image -->
      <img src="https://i.imgur.com/your-avatar.png" alt="avatar" class="avatar">

      <div class="username">xen</div>
      <div class="status">currently doing nothing</div>
      <div class="location">📍 Canada</div>

      <div class="socials">
        <!-- Instagram -->
        <a href="https://instagram.com/youruser" target="_blank" title="Instagram">📷</a>
        <!-- TikTok -->
        <a href="https://tiktok.com/@youruser" target="_blank" title="TikTok">🎵</a>
        <!-- Discord (or any other) -->
        <a href="https://discord.com/users/yourid" target="_blank" title="Discord">💬</a>
        <!-- YouTube – xenflarek -->
        <a href="https://youtube.com/@xenflarek" target="_blank" title="YouTube">▶️</a>
      </div>
    </div>

    <!-- Optional view counter (just visual for now) -->
    <div class="views">👁 1,036</div>
  </div>

  <script>
    const video = document.getElementById('bg-video');
    const overlay = document.getElementById('overlay');
    const content = document.getElementById('main-content');

    // Start completely paused
    video.pause();
    video.volume = 0.25;

    overlay.addEventListener('click', () => {
      // Fade out overlay
      overlay.style.opacity = '0';

      setTimeout(() => {
        overlay.style.display = 'none';
        content.classList.add('show');

        // Now start the video + unmute
        video.muted = false;
        video.play().catch(err => {
          console.log('Play failed:', err);
        });
      }, 600);
    });
  </script>
</body>
</html>
